<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Manrope', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #111111;
      color: #ffffff;
      padding: 16px 12px 36px;
      max-width: 960px;
      margin: 0 auto;
      min-height: 100vh;
      user-select: none;
    }
    body.visor-abierto { overflow: hidden; }

    .cabecera-galeria {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid #282828;
    }
    .btn-volver {
      background: #222222;
      color: #ffffff;
      border: 1px solid #005580;
      padding: 7px 14px;
      border-radius: 20px;
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      text-decoration: none;
      transition: background 0.2s, border-color 0.2s;
    }
    .btn-volver:hover {
      background: #2f2f2f;
      border-color: #38bdf8;
    }
    .titulo-categoria {
      font-size: 1.15rem;
      font-weight: 500;
      letter-spacing: 0.8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .titulo-subcarpeta {
      font-size: 0.92rem;
      font-weight: 600;
      color: #38bdf8;
      margin: 22px 0 10px;
      display: flex;
      align-items: center;
      gap: 6px;
      border-bottom: 1px solid #222222;
      padding-bottom: 5px;
    }

    .galeria {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }
    @media (min-width: 600px) {
      .galeria { grid-template-columns: repeat(3, 1fr); gap: 10px; }
    }
    @media (min-width: 768px) {
      .galeria { grid-template-columns: repeat(4, 1fr); gap: 12px; }
    }
    .galeria img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      background: #000000;
      border-radius: 6px;
      cursor: pointer;
      transition: transform 0.2s, opacity 0.2s;
      border: 1px solid #2a2a2a;
      display: block;
    }
    .galeria img:hover {
      transform: scale(1.02);
      opacity: 0.95;
    }
    .galeria img:active {
      transform: scale(0.97);
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.96);
      justify-content: center;
      align-items: center;
      z-index: 2000;
      touch-action: pan-y;
    }
    .modal-contenido {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      max-width: 95%;
      max-height: 85vh;
      width: 100%;
      user-select: none;
    }
    .modal img {
      max-width: 100%;
      max-height: 85vh;
      object-fit: contain;
      border-radius: 4px;
      display: block;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      pointer-events: auto;
    }

    .firma-visor {
      position: absolute;
      bottom: 12px;
      left: 12px;
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      padding: 5px 9px;
      border-radius: 4px;
      border: 1px solid rgba(255,255,255,0.1);
      color: rgba(255,255,255,0.82);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.68rem;
      letter-spacing: 0.3px;
      pointer-events: none;
      z-index: 2002;
      display: flex;
      align-items: center;
      gap: 5px;
      max-width: calc(100% - 24px);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .firma-visor .dot {
      color: rgba(255,255,255,0.4);
      font-weight: normal;
    }

    .btn-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      color: #ffffff;
      font-size: 1.8rem;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      background: rgba(0,0,0,0.45);
      border-radius: 50%;
      user-select: none;
      z-index: 2003;
      border: 1px solid rgba(255,255,255,0.2);
      transition: background 0.15s, transform 0.15s;
    }
    .btn-nav:hover { background: rgba(0,85,128,0.7); }
    .btn-nav:active {
      background: rgba(0,85,128,0.85);
      transform: translateY(-50%) scale(0.92);
    }
    .btn-prev { left: 8px; }
    .btn-next { right: 8px; }
    .btn-cerrar {
      position: absolute;
      top: 16px;
      right: 16px;
      color: white;
      font-size: 1.8rem;
      cursor: pointer;
      z-index: 2003;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255,255,255,0.12);
      border-radius: 50%;
      transition: background 0.2s;
    }
    .btn-cerrar:hover { background: rgba(255,255,255,0.25); }

    .redes-sociales {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 36px;
    }
    .btn-red {
      background: #222222;
      border-radius: 12px;
      padding: 12px 4px;
      text-align: center;
      color: #ffffff;
      text-decoration: none;
      font-size: 0.8rem;
      font-weight: 600;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: transform 0.15s;
    }
    .btn-red:active { transform: scale(0.96); }
    .btn-wsp { border: 2px solid #4ade80; color: #4ade80; }
    .btn-cat { border: 2px solid #facc15; color: #facc15; }
    .btn-ig  { border: 2px solid #fb923c; color: #fb923c; }

    footer {
      text-align: center;
      margin-top: 36px;
      padding-top: 20px;
      border-top: 1px solid #222222;
      color: #666666;
      font-size: 0.78rem;
    }
  </style>

<script>
    const API_KEY = 'AIzaSyAHNvLODt54qLomj14TUPbQyo-KJ_HO4ZM';
    const FOLDER_ID = '1cRFXW5h8P_z6gd0Zz91tct77Or5CBBZM';
    const NOMBRE_SECCION = 'Misceláneas';

    let fotosActuales = [];
    let indiceFotoActual = 0;

    async function cargarSubcarpetas() {
      const contenedor = document.getElementById('contenedor-secciones');
      const urlFolders = `https://www.googleapis.com/drive/v3/files?q='${FOLDER_ID}'+in+parents+and+mimeType='application/vnd.google-apps.folder'+and+trashed=false&orderBy=name&pageSize=1000&key=${API_KEY}&fields=files(id,name)`;
      try {
        const res = await fetch(urlFolders);
        const data = await res.json();
        if (data.files && data.files.length > 0) {
          contenedor.innerHTML = '';
          for (const sub of data.files) {
            await renderizarSubcarpeta(sub.id, sub.name);
          }
        } else {
          await renderizarFotosDirectas(FOLDER_ID, NOMBRE_SECCION);
        }
      } catch (err) {
        await renderizarFotosDirectas(FOLDER_ID, NOMBRE_SECCION);
      }
    }

    async function renderizarSubcarpeta(subId, subNombre) {
      const contenedor = document.getElementById('contenedor-secciones');
      const urlFiles = `https://www.googleapis.com/drive/v3/files?q='${subId}'+in+parents+and+mimeType+contains+'image/'+and+trashed=false&orderBy=name&pageSize=1000&key=${API_KEY}&fields=files(id,name)`;
      try {
        const res = await fetch(urlFiles);
        const data = await res.json();
        if (data.files && data.files.length > 0) {
          const seccion = document.createElement('section');
          seccion.innerHTML = `
            <h3 class="titulo-subcarpeta">
              <span class="material-symbols-outlined" style="font-size: 18px;">folder</span>
              <span>${subNombre}</span>
            </h3>
            <div class="galeria" id="galeria-${subId}"></div>
          `;
          contenedor.appendChild(seccion);
          const grid = seccion.querySelector(`#galeria-${subId}`);
          data.files.forEach(f => {
            const urlHD = `https://lh3.googleusercontent.com/d/${f.id}=w1600`;
            const index = fotosActuales.length;
            fotosActuales.push({ url: urlHD, name: f.name || 'foto.jpg', subcarpeta: subNombre });
            const img = document.createElement('img');
            img.src = `https://lh3.googleusercontent.com/d/${f.id}=w800`;
            img.alt = f.name;
            img.loading = 'lazy';
            img.onclick = () => abrirVisor(index);
            grid.appendChild(img);
          });
        }
      } catch (_) {}
    }

    async function renderizarFotosDirectas(folderId, nombreCarpeta) {
      const contenedor = document.getElementById('contenedor-secciones');
      const urlFiles = `https://www.googleapis.com/drive/v3/files?q='${folderId}'+in+parents+and+mimeType+contains+'image/'+and+trashed=false&orderBy=name&pageSize=1000&key=${API_KEY}&fields=files(id,name)`;
      try {
        const res = await fetch(urlFiles);
        const data = await res.json();
        if (data.files && data.files.length > 0) {
          contenedor.innerHTML = `<div class="galeria" id="galeria-directa"></div>`;
          const grid = document.getElementById('galeria-directa');
          data.files.forEach(f => {
            const urlHD = `https://lh3.googleusercontent.com/d/${f.id}=w1600`;
            const index = fotosActuales.length;
            fotosActuales.push({ url: urlHD, name: f.name || 'foto.jpg', subcarpeta: nombreCarpeta });
            const img = document.createElement('img');
            img.src = `https://lh3.googleusercontent.com/d/${f.id}=w800`;
            img.alt = f.name;
            img.loading = 'lazy';
            img.onclick = () => abrirVisor(index);
            grid.appendChild(img);
          });
        } else {
          contenedor.innerHTML = '<div style="text-align:center; padding: 50px 16px; color:#888;">No se encontraron fotografías disponibles en esta carpeta de Google Drive.</div>';
        }
      } catch (_) {
        contenedor.innerHTML = '<div style="text-align:center; padding: 50px 16px; color:#f87171;">No se pudo conectar a Google Drive. Verificá los permisos públicos de la carpeta.</div>';
      }
    }

    function abrirVisor(index) {
      if (index >= fotosActuales.length) index = 0;
      indiceFotoActual = index;
      actualizarContenidoVisor();
      document.getElementById('modal').style.display = 'flex';
      document.body.classList.add('visor-abierto');
      const foto = fotosActuales[indiceFotoActual];
      if (foto) registrarMetrica('foto_visor_hd', `Foto: #${foto.name} en ${foto.subcarpeta}`);
    }

    function actualizarContenidoVisor() {
      const foto = fotosActuales[indiceFotoActual];
      if (!foto) return;
      document.getElementById('img-ampliada').src = foto.url;
      document.getElementById('firma-subcarpeta').innerText = foto.subcarpeta || NOMBRE_SECCION;
      document.getElementById('firma-archivo').innerText = '#' + foto.name;
    }

    function cerrarVisor() {
      document.getElementById('modal').style.display = 'none';
      document.body.classList.remove('visor-abierto');
    }

    function cambiarFoto(dir) {
      if (fotosActuales.length === 0) return;
      indiceFotoActual += dir;
      if (indiceFotoActual >= fotosActuales.length) indiceFotoActual = 0;
      else if (indiceFotoActual < 0) indiceFotoActual = fotosActuales.length - 1;
      actualizarContenidoVisor();
    }

    document.getElementById('btn-cerrar-modal').addEventListener('click', e => { e.stopPropagation(); cerrarVisor(); });
    document.getElementById('btn-prev-modal').addEventListener('click', e => { e.stopPropagation(); cambiarFoto(-1); });
    document.getElementById('btn-next-modal').addEventListener('click', e => { e.stopPropagation(); cambiarFoto(1); });
    document.getElementById('modal').addEventListener('click', e => {
      if (e.target.id === 'modal' || e.target.id === 'modal-touch-area') cerrarVisor();
    });

    document.addEventListener('keydown', e => {
      const m = document.getElementById('modal');
      if (m && m.style.display === 'flex') {
        if (e.key === 'Escape') cerrarVisor();
        else if (e.key === 'ArrowLeft') cambiarFoto(-1);
        else if (e.key === 'ArrowRight') cambiarFoto(1);
      }
    });

    let touchStartX = 0;
    let touchStartY = 0;
    let touchEndX = 0;
    let touchEndY = 0;

    const modalTouch = document.getElementById('modal');

    modalTouch.addEventListener('touchstart', e => {
      if (e.touches && e.touches.length > 0) {
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
        touchEndX = touchStartX;
        touchEndY = touchStartY;
      }
    }, { passive: true });
