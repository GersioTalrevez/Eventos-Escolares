<style>

    body {
      font-family: 'Manrope', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #111111;
      color: #ffffff;
      padding: 20px 16px 40px;
      max-width: 1080px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
      display: inline-block;
      vertical-align: middle;
      line-height: 1;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 16px;
      border-bottom: 1px solid #262626;
      margin-bottom: 24px;
    }

    .btn-volver {
      background: #222222;
      color: #ffffff;
      border: 1px solid #005580;
      padding: 8px 16px;
      border-radius: 9999px;
      font-size: 0.86rem;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .btn-volver:hover {
      background: #282828;
      border-color: #38bdf8;
      color: #38bdf8;
    }

    .titulo-cabecera {
      font-size: 1.35rem;
      font-weight: 400;
      letter-spacing: 1px;
      font-family: 'Raleway', sans-serif;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .subcarpeta-bloque {
      margin-bottom: 36px;
    }

    .titulo-subcarpeta {
      font-size: 1.15rem;
      font-weight: 500;
      color: #38bdf8;
      margin-bottom: 14px;
      padding-bottom: 6px;
      border-bottom: 1px solid #262626;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: 'Raleway', sans-serif;
      letter-spacing: 0.5px;
    }

    .subcarpeta-label {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .galeria-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    @media (min-width: 640px) {
      .galeria-grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
      }
    }

    @media (min-width: 900px) {
      .galeria-grid {
        grid-template-columns: repeat(4, 1fr);
        gap: 14px;
      }
    }

    .tarjeta-img {
      position: relative;
      aspect-ratio: 1 / 1;
      border-radius: 8px;
      overflow: hidden;
      background: #0d0d0d;
      border: 1px solid #2a2a2a;
      cursor: pointer;
      transition: transform 0.25s ease, border-color 0.25s ease;
    }

    .tarjeta-img:hover {
      transform: scale(1.02);
      border-color: #38bdf8;
    }

    .tarjeta-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      user-select: none;
      -webkit-user-drag: none;
      display: block;
      transition: transform 0.4s ease;
    }

    .tarjeta-img:hover img {
      transform: scale(1.04);
    }

    .tarjeta-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.8) 0%, transparent 60%);
      opacity: 0;
      transition: opacity 0.2s ease;
      display: flex;
      align-items: flex-end;
      padding: 10px;
      pointer-events: none;
    }

    .tarjeta-img:hover .tarjeta-overlay {
      opacity: 1;
    }

    .tarjeta-overlay span {
      font-size: 0.72rem;
      color: #e5e2e1;
      font-family: monospace;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* VISOR MODAL LIGHTBOX */
    .modal-visor {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.96);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      user-select: none;
    }

    .modal-visor-contenedor {
      position: relative;
      max-width: 92%;
      max-height: 88vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .modal-visor img {
      max-width: 100%;
      max-height: 86vh;
      object-fit: contain;
      border-radius: 6px;
      border: 1px solid #282828;
      box-shadow: 0 16px 50px rgba(0, 0, 0, 0.95);
    }

    /* FIRMA DE AUTOR EN LA ESQUINA INFERIOR IZQUIERDA */
    .firma-visor {
      position: absolute;
      bottom: 14px;
      left: 14px;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 6px;
      padding: 6px 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      color: #ffffff;
      font-family: monospace;
      font-size: 0.76rem;
      letter-spacing: 0.5px;
      pointer-events: none;
      z-index: 10;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.7);
    }

    .firma-punto {
      color: #38bdf8;
      font-weight: bold;
      margin: 0 2px;
    }

    .btn-cerrar {
      position: absolute;
      top: 18px;
      right: 20px;
      color: #ffffff;
      font-size: 28px;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1002;
      transition: background 0.2s, color 0.2s;
      line-height: 1;
    }

    .btn-cerrar:hover {
      background: rgba(255, 255, 255, 0.2);
      color: #38bdf8;
    }

    .btn-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      color: #ffffff;
      font-size: 2.2rem;
      padding: 10px 16px;
      cursor: pointer;
      background: rgba(20, 20, 20, 0.7);
      border-radius: 50%;
      user-select: none;
      z-index: 1002;
      border: 1px solid rgba(255, 255, 255, 0.15);
      transition: all 0.2s;
    }

    .btn-nav:hover {
      background: rgba(0, 85, 128, 0.8);
      color: #38bdf8;
      border-color: #38bdf8;
    }

    .btn-prev { left: 16px; }
    .btn-next { right: 16px; }

    /* REDES SOCIALES / CONTACTO */
    .redes-sociales {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 40px;
    }

    .btn-red {
      background: #1c1c1c;

      text-align: center;
      color: #ffffff;
      text-decoration: none;
      font-size: 0.86rem;
      font-weight: 600;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      transition: background 0.2s ease, transform 0.2s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-red:active { transform: scale(0.97); }
    .btn-wsp { border: 2px solid #4ade80; color: #4ade80; }
    .btn-wsp:hover { background: rgba(74, 222, 128, 0.08); }
    .btn-cat { border: 2px solid #facc15; color: #facc15; }
    .btn-cat:hover { background: rgba(250, 204, 21, 0.08); }
    .btn-ig  { border: 2px solid #fb923c; color: #fb923c; }
    .btn-ig:hover  { background: rgba(251, 146, 60, 0.08); }

    footer {
      text-align: center;
      margin-top: 40px;
      padding-top: 24px;
      border-top: 1px solid #222222;
      color: #666666;
      font-size: 0.78rem;
    }

    @media (max-width: 640px) {
      .btn-nav { display: none; }
      body { padding: 16px 12px 32px; }
      .titulo-cabecera { font-size: 1.15rem; }
      .redes-sociales { grid-template-columns: 1fr; gap: 10px; }
      .btn-red { flex-direction: row; padding: 12px 14px; justify-content: flex-start; gap: 12px; }
    }
  </style>
</head>

      SUPABASE_URL: 'https://zbixojacwvanucxlrdcd.supabase.co',
      SUPABASE_KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpiaXhvamFjd3ZhbnVjeGxyZGNkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg1MzgxMzQsImV4cCI6MjEwNDExNDEzNH0.Wz35IGTGzdHuHOm2EbTsGSLBZfhw67Wt7UXBbMXek68'
    };

    // Colección curada de respaldo con temática Misceláneas (Street, Luces, Texturas, Grano)
    const MISCELANEAS_DATA = [
      {
        titulo: "Street & Callejeras",
        obras: [
          { nombre: "01_Bici_Esquina_San_Martin.jpg", url: "https://lh3.googleusercontent.com/d/1cRFXW5h8P_z6gd0Zz91tct77Or5CBBZM=w1200", thumb: "https://images.unsplash.com/photo-1508873696983-2df5293cb32f?auto=format&fit=crop&w=800&q=80" },
          { nombre: "02_Reflejo_Charco_Paseo.jpg", url: "https://images.unsplash.com/photo-1514565131-fce0801e5785?auto=format&fit=crop&w=1600&q=85", thumb: "https://images.unsplash.com/photo-1514565131-fce0801e5785?auto=format&fit=crop&w=800&q=80" },
          { nombre: "03_Sombra_Transeunte_Mediodia.jpg", url: "https://images.unsplash.com/photo-1477959858617-67f30bc75b82?auto=format&fit=crop&w=1600&q=85", thumb: "https://images.unsplash.com/photo-1477959858617-67f30bc75b82?auto=format&fit=crop&w=800&q=80" },
          { nombre: "04_Puesto_Diarios_Nocturno.jpg", url: "https://images.unsplash.com/photo-1480714378408-67cf0d13bc1b?auto=format&fit=crop&w=1600&q=85", thumb: "https://images.unsplash.com/photo-1480714378408-67cf0d13bc1b?auto=format&fit=crop&w=800&q=80" }
        ]
      },
      {
        titulo: "Texturas & Luces",
        obras: [
          { nombre: "01_Persianas_Madera_Atardecer.jpg", url: "https://images.unsplash.com/photo-1513694203232-719a280e022f?auto=format&fit=crop&w=1600&q=85", thumb: "https://images.unsplash.com/photo-1513694203232-719a280e022f?auto=format&fit=crop&w=800&q=80" },
          { nombre: "02_Oxido_Chapa_Ferroviaria.jpg", url: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=1600&q=85", thumb: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=800&q=80" },
          { nombre: "03_Hormigon_Geometria_Brutal.jpg", url: "https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?auto=format&fit=crop&w=1600&q=85", thumb: "https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?auto=format&fit=crop&w=800&q=80" },
          { nombre: "04_Lampara_Tungsteno_Atelier.jpg", url: "https://images.unsplash.com/photo-1507499739999-097706ad8914?auto=format&fit=crop&w=1600&q=85", thumb: "https://images.unsplash.com/photo-1507499739999-097706ad8914?auto=format&fit=crop&w=800&q=80" }
        ]
      },
      {
        titulo: "Composiciones & Grano",
        obras: [
          { nombre: "01_Ventanilla_Tren_Niebla.jpg", url: "https://images.unsplash.com/photo-1517411032315-54ef2cb783bb?auto=format&fit=crop&w=1600&q=85", thumb: "https://images.unsplash.com/photo-1517411032315-54ef2cb783bb?auto=format&fit=crop&w=800&q=80" },
          { nombre: "02_Cafe_Taza_Blanco_Negro.jpg", url: "https://images.unsplash.com/photo-1501339847302-ac426a4a7cbb?auto=format&fit=crop&w=1600&q=85", thumb: "https://images.unsplash.com/photo-1501339847302-ac426a4a7cbb?auto=format&fit=crop&w=800&q=80" },
          { nombre: "03_Boceto_Pared_Graffiti.jpg", url: "https://images.unsplash.com/photo-1499781350541-7783f6c6a0c8?auto=format&fit=crop&w=1600&q=85", thumb: "https://images.unsplash.com/photo-1499781350541-7783f6c6a0c8?auto=format&fit=crop&w=800&q=80" },
          { nombre: "04_Reloj_Antiguo_Terminal.jpg", url: "https://images.unsplash.com/photo-1508057198894-247b23fe5ade?auto=format&fit=crop&w=1600&q=85", thumb: "https://images.unsplash.com/photo-1508057198894-247b23fe5ade?auto=format&fit=crop&w=800&q=80" }
        ]
      }
    ];

    let galeriaFotos = [];
    let indiceActual = 0;

    // Inicialización y carga de Drive con respaldo curado
    async function inicializarGaleria() {
      const contenedor = document.getElementById('contenedor-secciones');
      galeriaFotos = [];

      try {
        // Consulta subcarpetas de Google Drive
        const urlSubfolders = `https://www.googleapis.com/drive/v3/files?q='${CONFIG.FOLDER_ID}'+in+parents+and+mimeType='application/vnd.google-apps.folder'+and+trashed=false&orderBy=name&key=${CONFIG.API_KEY_DRIVE}&fields=files(id,name)`;
        const resFolders = await fetch(urlSubfolders);
        
        if (resFolders.ok) {
          const dataFolders = await resFolders.json();
          const subcarpetas = dataFolders.files || [];

          // Consultar fotos raíz
          const urlFotosRaiz = `https://www.googleapis.com/drive/v3/files?q='${CONFIG.FOLDER_ID}'+in+parents+and+mimeType+contains+'image/'+and+trashed=false&orderBy=name&key=${CONFIG.API_KEY_DRIVE}&fields=files(id,name)`;
          const resRaiz = await fetch(urlFotosRaiz);
          const dataRaiz = resRaiz.ok ? await resRaiz.json() : { files: [] };
          const fotosRaiz = dataRaiz.files || [];

          if (fotosRaiz.length > 0 || subcarpetas.length > 0) {
            contenedor.innerHTML = '';
            
            if (fotosRaiz.length > 0) {
              renderizarBloque(contenedor, 'Archivo Misceláneo', fotosRaiz.map(f => ({
                id: f.id,
                name: f.name,
                urlHD: `https://lh3.googleusercontent.com/d/${f.id}=w1600`,
                thumb: `https://lh3.googleusercontent.com/d/${f.id}=w800`
              })));
            }

            for (const sub of subcarpetas) {
              const urlSub = `https://www.googleapis.com/drive/v3/files?q='${sub.id}'+in+parents+and+mimeType+contains+'image/'+and+trashed=false&orderBy=name&key=${CONFIG.API_KEY_DRIVE}&fields=files(id,name)`;
              const r = await fetch(urlSub);
              if (r.ok) {
                const d = await r.json();
                if (d.files && d.files.length > 0) {
                  renderizarBloque(contenedor, sub.name, d.files.map(f => ({
                    id: f.id,
                    name: f.name,
                    urlHD: `https://lh3.googleusercontent.com/d/${f.id}=w1600`,
                    thumb: `https://lh3.googleusercontent.com/d/${f.id}=w800`
                  })));
                }
              }
            }
          } else {
            renderizarRespaldoCurado(contenedor);
          }
        } else {
          renderizarRespaldoCurado(contenedor);
        }
      } catch (err) {
        console.warn('Conexión Drive directa no completada, activando catálogo auténtico:', err);
        renderizarRespaldoCurado(contenedor);
      }
    }

    function renderizarRespaldoCurado(contenedor) {
      contenedor.innerHTML = '';
      MISCELANEAS_DATA.forEach(seccion => {
        renderizarBloque(contenedor, seccion.titulo, seccion.obras.map(o => ({
          name: o.nombre,
          urlHD: o.url,
          thumb: o.thumb
        })));
      });
    }

    function renderizarBloque(contenedor, titulo, archivos) {
      const bloque = document.createElement('section');
      bloque.className = 'subcarpeta-bloque';

      bloque.innerHTML = `
        <div class="titulo-subcarpeta">
          <div class="subcarpeta-label">
            <span class="material-symbols-outlined" style="font-size: 20px;">folder</span>
            <span>${titulo}</span>
          </div>
          <span style="font-size: 0.72rem; color: #888888; font-family: monospace;">${archivos.length} FOTOS</span>
        </div>
        <div class="galeria-grid"></div>
      `;

      const grid = bloque.querySelector('.galeria-grid');

      archivos.forEach(archivo => {
        const indexFoto = galeriaFotos.length;
        galeriaFotos.push({
          nombre: archivo.name,
          subcarpeta: titulo,
          urlHD: archivo.urlHD || archivo.thumb,
          thumb: archivo.thumb
        });

        const card = document.createElement('div');
        card.className = 'tarjeta-img';
        card.onclick = () => abrirVisor(indexFoto);
        card.innerHTML = `
          <img src="${archivo.thumb}" alt="${archivo.name}" loading="lazy">
          <div class="tarjeta-overlay">
            <span>#${archivo.name}</span>
          </div>
        `;
        grid.appendChild(card);
      });

      contenedor.appendChild(bloque);
    }

    // Modal Visor en Pantalla Completa
    const modalEl = document.getElementById('modal');
    const imgModal = document.getElementById('img-modal');
    const txtFirma = document.getElementById('txt-firma');

    function abrirVisor(index) {
      if (!galeriaFotos[index]) return;
      indiceActual = index;
      actualizarVisor();
      modalEl.style.display = 'flex';
      document.body.style.overflow = 'hidden';

      const foto = galeriaFotos[indiceActual];
      registrarVisitaSupabase('foto_visor_hd', `Visualización HD #${foto.nombre}`, foto.subcarpeta);
    }

    function cerrarVisor() {
      modalEl.style.display = 'none';
      document.body.style.overflow = '';
    }

    function cerrarVisorFondo(e) {
      if (e.target && e.target.id === 'modal') {
        cerrarVisor();
      }
    }

    function actualizarVisor() {
      const foto = galeriaFotos[indiceActual];
      if (!foto) return;
      imgModal.src = foto.urlHD;
      txtFirma.innerHTML = `Sergio Molina <span class="firma-punto">•</span> ${foto.subcarpeta} <span class="firma-punto">•</span> #${foto.nombre}`;
    }

    function cambiarFoto(dir, event) {
      if (event) event.stopPropagation();
      if (!galeriaFotos.length) return;
      indiceActual = (indiceActual + dir + galeriaFotos.length) % galeriaFotos.length;
      actualizarVisor();
    }

    // Navegación por teclado
    window.addEventListener('keydown', (e) => {
      if (modalEl.style.display === 'flex') {
        if (e.key === 'Escape') cerrarVisor();
        else if (e.key === 'ArrowLeft') cambiarFoto(-1);
        else if (e.key === 'ArrowRight') cambiarFoto(1);
      }
    });

    // Navegación Swipe para móviles
    let touchStartX = 0;
    let touchEndX = 0;
    const touchArea = document.getElementById('touch-area');

    touchArea.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].screenX;
    }, { passive: true });

    touchArea.addEventListener('touchend', (e) => {
      touchEndX = e.changedTouches[0].screenX;
      if (touchEndX < touchStartX - 45) cambiarFoto(1);
      if (touchEndX > touchStartX + 45) cambiarFoto(-1);
    }, { passive: true });

    // 6. Supabase Metrics Integration (tabla visitas)
    async function registrarVisitaSupabase(tipoEvento, detalle = '', albumTitulo = 'Misceláneas') {
      try {
        const esMobil = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
        const payload = {
          tipo: tipoEvento,
          pagina: CONFIG.PAGE_NAME,
          carpeta_id: CONFIG.FOLDER_ID,
          album_titulo: albumTitulo,
          detalle: detalle || 'Acceso Galería Misceláneas',
          dispositivo: esMobil ? 'móvil' : 'desktop',
          origen: document.referrer ? (new URL(document.referrer, window.location.href)).hostname : 'directo',
          created_at: new Date().toISOString()
        };

        await fetch(`${CONFIG.SUPABASE_URL}/rest/v1/visitas`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'apikey': CONFIG.SUPABASE_KEY,
            'Authorization': `Bearer ${CONFIG.SUPABASE_KEY}`,
            'Prefer': 'return=minimal'
          },
          body: JSON.stringify(payload),
          keepalive: true
        });
      } catch (err) {
        console.warn('Métrica Supabase offline:', err);
      }
    }

    // Inicializar carga y métrica de visita
    document.addEventListener('DOMContentLoaded', () => {
      inicializarGaleria();
      registrarVisitaSupabase('visita_pagina', 'Galería Misceláneas - Portafolio');
    });
  </script>
