<script>
  // Authorized configuration
  const AUTHORIZED_EMAIL = 'molinaoksergio@gmail.com';
  const VALID_MASTER_PASSWORDS = [
    'molina2026',
    'sergiomolina',
    'admin2026',
    'miprueba',
    'admin',
    'molina',
    'sergio'
  ];

  // Optional Supabase client initialization if credentials exist
  let supaClient = null;
  try {
    const supabaseUrl = window.SUPABASE_URL || localStorage.getItem('supabase_url') || 'https://example.supabase.co';
    const supabaseKey = window.SUPABASE_ANON_KEY || localStorage.getItem('supabase_anon_key') || 'anon-key';
    if (window.supabase && typeof window.supabase.createClient === 'function' && !supabaseUrl.includes('example.supabase.co')) {
      supaClient = window.supabase.createClient(supabaseUrl, supabaseKey);
    }
  } catch (err) {
    console.log('Supabase client optional initialization skipped:', err);
  }

  // Toggle password visibility
  function togglePasswordVisibility() {
    const passwordInput = document.getElementById('admin-password');
    const iconSpan = document.getElementById('password-icon');
    if (!passwordInput) return;
    
    if (passwordInput.type === 'password') {
      passwordInput.type = 'text';
      iconSpan.textContent = 'visibility_off';
    } else {
      passwordInput.type = 'password';
      iconSpan.textContent = 'visibility';
    }
  }

  // Helper to show dynamic messages
  function showStatus(message, type = 'info') {
    const statusEl = document.getElementById('status-message');
    if (!statusEl) return;
    statusEl.classList.remove('hidden');

    if (type === 'success') {
      statusEl.className = 'p-space-xs rounded-lg text-center font-label-sm text-label-sm transition-all bg-primary-container/20 text-primary border border-primary-container flex items-center justify-center gap-1.5';
      statusEl.innerHTML = `<span class="material-symbols-outlined text-base">check_circle</span><span>${message}</span>`;
    } else if (type === 'error') {
      statusEl.className = 'p-space-xs rounded-lg text-center font-label-sm text-label-sm transition-all bg-error-container/40 text-error border border-error/50 flex items-center justify-center gap-1.5';
      statusEl.innerHTML = `<span class="material-symbols-outlined text-base">error</span><span>${message}</span>`;
    } else {
      statusEl.className = 'p-space-xs rounded-lg text-center font-label-sm text-label-sm transition-all bg-secondary-container/30 text-secondary border border-secondary/40 flex items-center justify-center gap-1.5';
      statusEl.innerHTML = `<span class="material-symbols-outlined text-base">info</span><span>${message}</span>`;
    }
  }

  // Store authorized session and redirect to panel.html
  function grantAdminAccess() {
    const sessionData = {
      email: AUTHORIZED_EMAIL,
      name: 'Sergio Ricardo Molina',
      role: 'OWNER',
      authenticatedAt: new Date().toISOString()
    };
    sessionStorage.setItem('srm_admin_session', JSON.stringify(sessionData));
    sessionStorage.setItem('admin_autenticado', 'true');
    sessionStorage.setItem('eventos_fotografo_auth', 'true');
    sessionStorage.setItem('eventos_fotografo_email', AUTHORIZED_EMAIL);
    localStorage.setItem('srm_last_auth', JSON.stringify({ email: AUTHORIZED_EMAIL, time: Date.now() }));

    showStatus(`¡Identidad verificada como ${AUTHORIZED_EMAIL}! Ingresando al panel...`, 'success');

    setTimeout(() => {
      window.location.href = 'panel.html';
    }, 800);
  }

  // Handle Master Password Login
  function handleStrictPasswordLogin() {
    const passwordInput = document.getElementById('admin-password');
    const submitBtn = document.getElementById('submit-password-btn');
    const submitIcon = document.getElementById('submit-btn-icon');
    const submitText = document.getElementById('submit-btn-text');
    const enteredPassword = (passwordInput?.value || '').trim();

    if (!enteredPassword) {
      showStatus('Por favor ingrese su contraseña maestra.', 'error');
      passwordInput.focus();
      return;
    }

    // Set button loading state
    submitBtn.disabled = true;
    submitBtn.classList.add('opacity-80', 'cursor-wait');
    submitIcon.textContent = 'progress_activity';
    submitIcon.classList.add('animate-spin');
    submitText.textContent = 'Verificando...';

    setTimeout(() => {
      const isMatch = VALID_MASTER_PASSWORDS.some(valid => valid.toLowerCase() === enteredPassword.toLowerCase());

      if (isMatch) {
        grantAdminAccess();
      } else {
        submitBtn.disabled = false;
        submitBtn.classList.remove('opacity-80', 'cursor-wait');
        submitIcon.textContent = 'lock';
        submitIcon.classList.remove('animate-spin');
        submitText.textContent = 'Verificar e Ingresar';
        
        sessionStorage.removeItem('admin_autenticado');
        sessionStorage.removeItem('eventos_fotografo_auth');
        sessionStorage.removeItem('srm_admin_session');

        showStatus('Contraseña incorrecta. Acceso restringido únicamente a ' + AUTHORIZED_EMAIL + '.', 'error');
        passwordInput.classList.add('border-error');
        passwordInput.focus();
        setTimeout(() => passwordInput.classList.remove('border-error'), 2500);
      }
    }, 400);
  }

  // Handle Google OAuth Authentication
  async function handleStrictGoogleAuth() {
    const googleBtn = document.getElementById('google-oauth-btn');
    const googleText = document.getElementById('google-btn-text');
    const passwordInput = document.getElementById('admin-password');

    // UI Feedback immediately
    googleBtn.disabled = true;
    googleBtn.classList.add('opacity-80', 'cursor-wait');
    googleText.innerHTML = `
      <span class="inline-flex items-center gap-2">
        <span class="material-symbols-outlined text-base animate-spin text-primary">sync</span>
        <span>Conectando con Google...</span>
      </span>
    `;

    // Attempt real Supabase OAuth if available
    let oauthHandled = false;
    if (supaClient && supaClient.auth) {
      try {
        const { data, error } = await supaClient.auth.signInWithOAuth({
          provider: 'google',
          options: {
            redirectTo: window.location.origin + window.location.pathname
          }
        });

        if (!error && data?.url) {
          oauthHandled = true;
          window.location.href = data.url;
          return;
        }
      } catch (e) {
        console.warn('OAuth provider not active on client, executing authorized fallback:', e);
      }
    }

    // Fallback: If password already entered, check and log in right away
    setTimeout(() => {
      const currentPass = (passwordInput?.value || '').trim();
      if (currentPass && VALID_MASTER_PASSWORDS.some(valid => valid.toLowerCase() === currentPass.toLowerCase())) {
        grantAdminAccess();
        return;
      }

      // If no password or OAuth unavailable: Prompt user clearly
      googleBtn.disabled = false;
      googleBtn.classList.remove('opacity-80', 'cursor-wait');
      googleText.textContent = 'Autenticar con Google Workspace';

      showStatus(`Validando ${AUTHORIZED_EMAIL}. Ingrese su clave maestra para confirmar acceso.`, 'info');
      if (passwordInput) {
        passwordInput.focus();
        passwordInput.classList.add('border-primary');
        setTimeout(() => passwordInput.classList.remove('border-primary'), 2000);
      }
    }, 600);
  }

  // Verification on load (Session or OAuth return check)
  document.addEventListener('DOMContentLoaded', async () => {
    // Check existing valid session
    const existingAuth = sessionStorage.getItem('admin_autenticado');
    const existingEmail = sessionStorage.getItem('eventos_fotografo_email');
    if (existingAuth === 'true' && existingEmail === AUTHORIZED_EMAIL) {
      showStatus('Sesión activa detectada. Ingresando al panel...', 'success');
      setTimeout(() => {
        window.location.href = 'panel.html';
      }, 500);
      return;
    }

    // Check Supabase session from OAuth redirect URL hash or storage
    if (supaClient && supaClient.auth) {
      try {
        const { data: { session }, error } = await supaClient.auth.getSession();
        if (session && session.user) {
          const userEmail = (session.user.email || '').toLowerCase().trim();
          if (userEmail === AUTHORIZED_EMAIL) {
            grantAdminAccess();
          } else {
            await supaClient.auth.signOut();
            showStatus(`Acceso denegado. La cuenta ${userEmail} no está autorizada.`, 'error');
          }
        }
      } catch (err) {
        console.log('Session check complete:', err);
      }
    }
  });
</script>
