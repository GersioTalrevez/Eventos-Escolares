<script class="">
  function handleGoogleLogin() {
    const btn = document.getElementById('google-oauth-btn');
    const statusEl = document.getElementById('status-message');
    const authorizedEmail = 'molinaoksergio@gmail.com';

    btn.disabled = true;
    btn.classList.add('opacity-75', 'pointer-events-none');
    btn.innerHTML = `
      <span class="material-symbols-outlined text-lg animate-spin text-primary" data-icon="progress_activity">progress_activity</span>
      <span>Conectando con Google...</span>
    `;

    setTimeout(() => {
      // Authorized photographer verification
      sessionStorage.setItem('srm_admin_session', JSON.stringify({
        email: authorizedEmail,
        name: 'Sergio Ricardo Molina',
        role: 'OWNER',
        authenticatedAt: new Date().toISOString()
      }));

      statusEl.className = 'p-space-xs rounded-lg text-center font-label-sm text-label-sm transition-all bg-primary-container/20 text-primary border border-primary-container flex items-center justify-center gap-1.5';
      statusEl.innerHTML = `
        <span class="material-symbols-outlined text-base" data-icon="check_circle">check_circle</span>
        <span>Acceso concedido para ${authorizedEmail}. Redirigiendo...</span>
      `;

      setTimeout(() => {
        window.location.href = 'panel.html';
      }, 1000);
    }, 900);
  }
</script>
<!-- Micro-interactions Script -->
<script>
    // Set dynamic year
    document.getElementById('current-year').textContent = new Date().getFullYear();

    // Toggle password visibility
    function togglePasswordVisibility() {
      const passwordInput = document.getElementById('admin-password');
      const iconSpan = document.getElementById('password-icon');
      
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        iconSpan.textContent = 'visibility_off';
      } else {
        passwordInput.type = 'password';
        iconSpan.textContent = 'visibility';
      }
    }

    // Interactive mock login verification
    function handleLogin() {
      const password = document.getElementById('admin-password').value;
      const statusEl = document.getElementById('status-message');
      const submitBtn = document.getElementById('submit-btn');

      if (!password) return;

      // Loading state
      submitBtn.disabled = true;
      submitBtn.classList.add('opacity-70', 'cursor-not-allowed');
      submitBtn.innerHTML = `
        <span class="material-symbols-outlined text-lg animate-spin" data-icon="sync">sync</span>
        <span>Verificando Credenciales...</span>
      `;

      setTimeout(() => {
        // Mock successful validation for the photographer
        statusEl.classList.remove('hidden', 'bg-error/10', 'text-error', 'border-error/40');
        statusEl.classList.add('bg-primary-container/20', 'text-primary', 'border', 'border-primary-container');
        statusEl.innerHTML = `
          <div class="flex items-center justify-center gap-1.5">
            <span class="material-symbols-outlined text-base" data-icon="check_circle">check_circle</span>
            <span>Credenciales correctas. Redirigiendo al panel...</span>
          </div>
        `;

        setTimeout(() => {
          window.location.href = '#dashboard-panel';
          submitBtn.disabled = false;
          submitBtn.classList.remove('opacity-70', 'cursor-not-allowed');
          submitBtn.innerHTML = `
            <span>Ingresar al Panel de Control</span>
            <span class="material-symbols-outlined text-lg" data-icon="arrow_forward">arrow_forward</span>
          `;
        }, 1200);
      }, 900);
    }
  </script>
