<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Manrope', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #111111; color: #ffffff; padding: 20px 16px 40px; max-width: 960px; margin: 0 auto; min-height: 100vh; }
    .cabecera-galeria { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; padding-bottom: 12px; border-bottom: 1px solid #282828; }
    .btn-volver { background: #222222; color: #ffffff; border: 1px solid #005580; padding: 8px 16px; border-radius: 20px; font-size: 0.88rem; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; text-decoration: none; transition: background 0.2s, border-color 0.2s; }
    .btn-volver:hover { background: #2f2f2f; border-color: #38bdf8; }
    .titulo-categoria { font-size: 1.3rem; font-weight: 400; letter-spacing: 1px; display: flex; align-items: center; gap: 8px; }
    .titulo-subcarpeta { font-size: 1rem; font-weight: 500; color: #38bdf8; margin: 26px 0 12px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid #222; padding-bottom: 6px; }
    .galeria { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    @media (min-width: 600px) { .galeria { grid-template-columns: repeat(3, 1fr); gap: 10px; } }
    @media (min-width: 768px) { .galeria { grid-template-columns: repeat(4, 1fr); gap: 12px; } }
    .galeria img { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; background: #000000; border-radius: 8px; cursor: pointer; transition: transform 0.2s, opacity 0.2s; border: 1px solid #2a2a2a; }
    .galeria img:hover { transform: scale(1.02); opacity: 0.95; }
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.96); justify-content: center; align-items: center; z-index: 1000; }
    .modal-contenido { position: relative; display: inline-block; max-width: 92%; max-height: 85vh; }
    .modal img { max-width: 100%; max-height: 85vh; object-fit: contain; border-radius: 4px; display: block; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
    .firma-visor { position: absolute; bottom: 12px; left: 14px; background: rgba(0,0,0,0.65); backdrop-filter: blur(4px); padding: 5px 10px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.15); color: #e0e0e0; font-family: monospace; font-size: 0.75rem; letter-spacing: 0.5px; pointer-events: none; z-index: 1002; display: flex; align-items: center; gap: 6px; }
    .firma-visor .dot { color: #38bdf8; }
    .btn-nav { position: absolute; top: 50%; transform: translateY(-50%); color: white; font-size: 2.2rem; padding: 14px 20px; cursor: pointer; background: rgba(0,0,0,0.5); border-radius: 50%; user-select: none; z-index: 1001; border: 1px solid rgba(255,255,255,0.15); transition: background 0.2s; }
    .btn-nav:hover { background: rgba(0,85,128,0.7); }
    .btn-prev { left: 16px; }
    .btn-next { right: 16px; }
    .btn-cerrar { position: absolute; top: 20px; right: 24px; color: white; font-size: 2rem; cursor: pointer; z-index: 1001; padding: 4px 14px; background: rgba(255,255,255,0.08); border-radius: 50%; }
    .redes-sociales { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 40px; }
    .btn-red { background: #222222; border-radius: 12px; padding: 14px 6px; text-align: center; color: #ffffff; text-decoration: none; font-size: 0.88rem; font-weight: 600; box-shadow: 0 4px 10px rgba(0,0,0,0.3); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; transition: transform 0.2s; }
    .btn-red:active { transform: scale(0.96); }
    .btn-wsp { border: 2px solid #4ade80; color: #4ade80; }
    .btn-cat { border: 2px solid #facc15; color: #facc15; }
    .btn-ig  { border: 2px solid #fb923c; color: #fb923c; }
    footer { text-align: center; margin-top: 40px; padding-top: 20px; border-top: 1px solid #222222; color: #666666; font-size: 0.8rem; }
    @media (max-width: 600px) { .btn-nav { display: none; } }
  </style>
</head>
<body style="padding: 16px 12px 32px; max-width: 960px; margin: 0 auto; min-height: 100vh;">
<div class="cabecera-galeria" style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; padding-bottom: 10px; border-bottom: 1px solid #282828; gap: 8px;">
<a class="btn-volver" href="index.html" style="font-size: 0.8rem; padding: 6px 12px; gap: 4px; white-space: nowrap;">← Volver al Portafolio</a>
<h2 class="titulo-categoria" style="font-size: 1.15rem; gap: 6px; letter-spacing: 0.5px; white-space: nowrap;">
<span class="material-symbols-outlined" style="color: #38bdf8;">auto_awesome</span>
<span>Ensayos</span>
</h2>
</div>
<main id="contenedor-secciones">
<div style="text-align:center; padding: 60px 0; color: #888;">
<div style="width: 32px; height: 32px; border: 2px solid #005580; border-top-color: #38bdf8; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 14px;"></div>
      Cargando colección de Ensayos...
    </div>
</main>
<div class="redes-sociales" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 28px;">
<a class="btn-red btn-wsp" href="https://wa.me/542613175222" style="padding: 10px 4px; font-size: 0.75rem; border-radius: 10px; gap: 3px;" target="_blank">

</a>
<a class="btn-red btn-cat" href="https://wa.me/c/5492613175222" style="padding: 10px 4px; font-size: 0.75rem; border-radius: 10px; gap: 3px;" target="_blank">
<span class="material-symbols-outlined">inventory_2</span>
<span>Catálogo</span>
</a>
<a class="btn-red btn-ig" href="https://www.instagram.com/sergioricardo.molina?igsi=OG84bTUxanllMnh4" style="padding: 10px 4px; font-size: 0.75rem; border-radius: 10px; gap: 3px;" target="_blank">
<span class="material-symbols-outlined">photo_camera_back</span>
<span>Instagram</span>
</a>
</div>
<footer style="margin-top: 28px; padding-top: 16px; font-size: 0.72rem; line-height: 1.4;">
<p>© Sergio Ricardo Molina · Fotografía Profesional · Mendoza, Argentina</p>
</footer>
<div class="modal" id="modal" onclick="cerrarVisorFondo(event)">
<span class="btn-cerrar" onclick="cerrarVisor()">×</span>
<span class="btn-nav btn-prev" onclick="cambiarFoto(-1, event)">❮</span>
<div class="modal-contenido" onclick="event.stopPropagation()">
<img alt="Ensayos Sergio Molina" id="img-ampliada" src=""/>
<div class="firma-visor" id="firma-visor" style="position: absolute; bottom: 12px; left: 14px; background: rgba(0,0,0,0.45); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); padding: 5px 10px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.08); color: #e0e0e0; font-family: monospace; font-size: 0.75rem; letter-spacing: 0.5px; pointer-events: none; z-index: 1002; display: flex; align-items: center; gap: 6px;">
<span>Sergio Molina</span>
<span class="dot">•</span>
<span id="firma-subcarpeta">Ensayos</span>
<span class="dot">•</span>
<span id="firma-archivo">#foto.jpg</span>
</div>
</div>
<span class="btn-nav btn-next" onclick="cambiarFoto(1, event)">❯</span>
</div>
<script>
    const API_KEY = 'AIzaSyAHNvLODt54qLomj14TUPbQyo-KJ_HO4ZM';
    const FOLDER_ID = '1K4h3SPq2WdCEMMzrTSToD-quebXDD4rS';
    const NOMBRE_SECCION = 'Ensayos';

    let fotosActuales = [];
    let indiceFotoActual = 0;

    async function cargarSubcarpetas() {
      const contenedor = document.getElementById('contenedor-secciones');
      const urlFolders = `https://www.googleapis.com/drive/v3/files?q='${FOLDER_ID}'+in+parents+and+mimeType='application/vnd.google-apps.folder'+and+trashed=false&orderBy=name&key=${API_KEY}&fields=files(id,name)`;
      try {
        const res = await fetch(urlFolders);
        const data = await res.json();
        if (data.files && data.files.length > 0) {
          contenedor.innerHTML = '';
          for (const sub of data.files) {
            await renderizarSubcarpeta(sub.id, sub.name);
          }
        } else {
          await renderizarFotosDirectas(FOLDER_ID, NOMBRE_SECCION);
        }
      } catch (err) {
        await renderizarFotosDirectas(FOLDER_ID, NOMBRE_SECCION);
      }
    }

    async function renderizarSubcarpeta(subId, subNombre) {
      const contenedor = document.getElementById('contenedor-secciones');
      const urlFiles = `https://www.googleapis.com/drive/v3/files?q='${subId}'+in+parents+and+mimeType+contains+'image/'+and+trashed=false&orderBy=name&key=${API_KEY}&fields=files(id,name)`;
      try {
        const res = await fetch(urlFiles);
        const data = await res.json();
        if (data.files && data.files.length > 0) {
          const seccion = document.createElement('section');
          seccion.innerHTML = `
            <h3 class="titulo-subcarpeta">
              <span class="material-symbols-outlined" style="font-size: 20px;">folder</span>
              <span>${subNombre}</span>
            </h3>
            <div class="galeria" id="galeria-${subId}"></div>
          `;
          contenedor.appendChild(seccion);
          const grid = seccion.querySelector(`#galeria-${subId}`);
          data.files.forEach(f => {
            const urlHD = `https://lh3.googleusercontent.com/d/${f.id}=w1600`;
            const indexGlobal = fotosActuales.length;
            fotosActuales.push({ url: urlHD, name: f.name || 'foto.jpg', subcarpeta: subNombre });
            const img = document.createElement('img');
            img.src = `https://lh3.googleusercontent.com/d/${f.id}=w800`;
            img.alt = f.name;
            img.loading = 'lazy';
            img.onclick = () => abrirVisor(indexGlobal);
            grid.appendChild(img);
          });
        }
      } catch (_) {}
    }

    async function renderizarFotosDirectas(folderId, nombreCarpeta) {
      const contenedor = document.getElementById('contenedor-secciones');
      const urlFiles = `https://www.googleapis.com/drive/v3/files?q='${folderId}'+in+parents+and+mimeType+contains+'image/'+and+trashed=false&orderBy=name&key=${API_KEY}&fields=files(id,name)`;
      try {
        const res = await fetch(urlFiles);
        const data = await res.json();
        if (data.files && data.files.length > 0) {
          contenedor.innerHTML = `<div class="galeria" id="galeria-directa"></div>`;
          const grid = document.getElementById('galeria-directa');
          data.files.forEach(f => {
            const urlHD = `https://lh3.googleusercontent.com/d/${f.id}=w1600`;
            const indexGlobal = fotosActuales.length;
            fotosActuales.push({ url: urlHD, name: f.name || 'foto.jpg', subcarpeta: nombreCarpeta });
            const img = document.createElement('img');
            img.src = `https://lh3.googleusercontent.com/d/${f.id}=w800`;
            img.alt = f.name;
            img.loading = 'lazy';
            img.onclick = () => abrirVisor(indexGlobal);
            grid.appendChild(img);
          });
        }
      } catch (_) {}
    }

    function abrirVisor(index) {
      indiceFotoActual = index;
      const foto = fotosActuales[indiceFotoActual];
      if (!foto) return;
      document.getElementById('img-ampliada').src = foto.url;
      document.getElementById('firma-subcarpeta').innerText = foto.subcarpeta || NOMBRE_SECCION;
      document.getElementById('firma-archivo').innerText = '#' + foto.name;
      document.getElementById('modal').style.display = 'flex';
      registrarMetrica('foto_visor_hd', `Foto: #${foto.name} en ${foto.subcarpeta}`);
    }

    function cerrarVisor() { document.getElementById('modal').style.display = 'none'; }
    function cerrarVisorFondo(e) { if (e.target.id === 'modal') cerrarVisor(); }
    function cambiarFoto(dir, event) {
      if (event) event.stopPropagation();
      indiceFotoActual += dir;
      if (indiceFotoActual >= fotosActuales.length) indiceFotoActual = 0;
      else if (indiceFotoActual < 0) indiceFotoActual = fotosActuales.length - 1;
      const foto = fotosActuales[indiceFotoActual];
      if (foto) {
        document.getElementById('img-ampliada').src = foto.url;
        document.getElementById('firma-subcarpeta').innerText = foto.subcarpeta || NOMBRE_SECCION;
        document.getElementById('firma-archivo').innerText = '#' + foto.name;
      }
    }

    document.addEventListener('keydown', e => {
      const m = document.getElementById('modal');
      if (m && m.style.display === 'flex') {
        if (e.key === 'Escape') cerrarVisor();
        else if (e.key === 'ArrowLeft') cambiarFoto(-1);
        else if (e.key === 'ArrowRight') cambiarFoto(1);
      }
    });

    let touchStartX = 0;
    const modalEl = document.getElementById('modal');
    modalEl.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].screenX; }, false);
    modalEl.addEventListener('touchend', e => {
      const touchEndX = e.changedTouches[0].screenX;
      if (touchEndX + 50 < touchStartX) cambiarFoto(1);
      else if (touchEndX > touchStartX + 50) cambiarFoto(-1);
    }, false);

    async function registrarMetrica(tipo, detalle) {
      try {
        if (window.supabase) {
          const client = window.supabase.createClient('https://zbixojacwvanucxlrdcd.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpiaXhvamFjd3ZhbnVjeGxyZGNkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg1MzgxMzQsImV4cCI6MjEwNDExNDEzNH0.Wz35IGTGzdHuHOm2EbTsGSLBZfhw67Wt7UXBbMXek68');
          await client.from('visitas').insert([{ tipo, pagina: 'ensayos.html', detalle, dispositivo: window.innerWidth < 640 ? 'mobile' : 'desktop' }]);
        }
      } catch (_) {}
    }

    document.addEventListener('DOMContentLoaded', () => {
      cargarSubcarpetas();
      registrarMetrica('visita_pagina', 'Visita a galería Ensayos');
    });
  </script>
</body>
</html>
