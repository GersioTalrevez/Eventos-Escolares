<!DOCTYPE html><html lang="es" style=""><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1, viewport-fit=cover" name="viewport">
<title>Flyer Molina Fotografía</title>
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
    /* Concepto: el flyer replica la web de Sergio (fondo oscuro, carpetas en celeste, botones de colores)
       y pone sus fotos como mosaico: una grande y cinco chicas, cada una con su etiqueta de carpeta. Formato 9:16. */
    :root {
      color-scheme: dark;
      --bg: #0f0f10;
      --panel: #202021;
      --edge: #0b4f7a;
      --cyan: #35b4f5;
      --text: #f3f3f4;
      --muted: #a4a4aa;
      --green: #3fdc84;
      --yellow: #f6c61a;
      --orange: #f58a2b;
      --font: "Manrope", "Segoe UI", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      padding-inline: 16px;
      padding-block: 24px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    img { max-width: 100%; }
    .wrap {
      width: 100%;
      max-width: 440px;
      margin-inline: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .hint {
      font-size: 13px;
      line-height: 1.5;
      color: var(--muted);
      margin: 0;
      text-align: center;
    }
    .flyer {
      container-type: inline-size;
      width: 100%;
      aspect-ratio: 9 / 16;
      background: var(--bg);
      border: 1px solid #2a2a2c;
      border-radius: 18px;
      padding: 6cqw;
      display: flex;
      flex-direction: column;
      gap: 3.2cqw;
      box-shadow: 0 16px 40px rgba(0,0,0,0.7);
    }
    .head {
      display: flex;
      align-items: center;
      gap: 3.4cqw;
    }
    .avatar {
      width: 13cqw;
      height: 13cqw;
      border-radius: 50%;
      border: .7cqw solid var(--edge);
      object-fit: cover;
      flex: none;
      box-shadow: 0 4px 14px rgba(0,0,0,0.5);
    }
    .who { min-width: 0; }
    .who b {
      display: block;
      font-size: 4.4cqw;
      font-weight: 800;
      letter-spacing: .01em;
      text-transform: uppercase;
      line-height: 1.15;
      color: #ffffff;
    }
    .who span {
      display: block;
      font-size: 2.5cqw;
      font-weight: 600;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: var(--cyan);
      margin-top: .8cqw;
    }
    h1 {
      font-size: 9.6cqw;
      line-height: 1.05;
      font-weight: 800;
      letter-spacing: -.02em;
      margin: 1cqw 0 0;
      text-wrap: balance;
    }
    h1 span { color: var(--cyan); }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 2cqw;
    }
    .tile {
      position: relative;
      border-radius: 2.6cqw;
      overflow: hidden;
      border: .35cqw solid #2c2c2f;
      background: var(--panel);
      aspect-ratio: 1;
      min-width: 0;
      margin: 0;
    }
    .tile.big {
      grid-column: span 2;
      grid-row: span 2;
      aspect-ratio: auto;
    }
    .tile img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .tag {
      position: absolute;
      left: 1.8cqw;
      bottom: 1.8cqw;
      display: flex;
      align-items: center;
      gap: 1cqw;
      background: rgba(15, 15, 16, .85);
      backdrop-filter: blur(4px);
      color: var(--cyan);
      font-size: 2.4cqw;
      font-weight: 700;
      padding: .9cqw 1.8cqw;
      border-radius: 1.2cqw;
      line-height: 1;
      border: 1px solid rgba(255,255,255,0.08);
      z-index: 2;
    }
    .tag svg {
      width: 2.6cqw;
      height: 2.6cqw;
      flex: none;
    }
    .big .tag {
      font-size: 3cqw;
      padding: 1.1cqw 2.2cqw;
      left: 2.2cqw;
      bottom: 2.2cqw;
    }
    .big .tag svg {
      width: 3.2cqw;
      height: 3.2cqw;
    }
    .cta {
      display: flex;
      flex-direction: column;
      gap: 2cqw;
      margin-top: auto;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2.4cqw;
      background: var(--panel);
      border: .55cqw solid;
      border-radius: 3.2cqw;
      text-decoration: none;
      padding: 2.4cqw 3cqw;
      min-width: 0;
      transition: transform 0.15s ease, filter 0.15s ease;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .btn svg {
      width: 5.6cqw;
      height: 5.6cqw;
      flex: none;
    }
    .btn small {
      display: block;
      font-size: 2.3cqw;
      font-weight: 600;
      opacity: .88;
      line-height: 1.25;
    }
    .btn strong {
      display: block;
      font-size: 3.3cqw;
      font-weight: 800;
      line-height: 1.25;
    }
    .btn .t { min-width: 0; }
    .wa {
      color: var(--green);
      border-color: var(--green);
      padding-block: 3.2cqw;
    }
    .wa strong {
      font-size: 5.4cqw;
      letter-spacing: .01em;
      color: var(--text);
    }
    .wa svg {
      width: 8cqw;
      height: 8cqw;
    }
    .row {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 2cqw;
    }
    .cat {
      color: var(--yellow);
      border-color: var(--yellow);
    }
    .ig {
      color: var(--orange);
      border-color: var(--orange);
    }
    .btn.cat strong, .btn.ig strong {
      color: var(--text);
      font-size: 3.1cqw;
    }
    .foot {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: .6cqw;
      text-align: center;
      font-size: 2.2cqw;
      color: var(--muted);
      font-weight: 600;
      letter-spacing: .02em;
      margin-top: 1cqw;
    }
    .foot b {
      color: var(--cyan);
      font-weight: 700;
    }
  </style>
</head>
<body>
